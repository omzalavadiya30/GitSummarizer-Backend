//spring.application.name=backend
spring.application.name=gitsummarizer-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gitsummarizer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Optional: configure a GitHub token through the GITHUB_TOKEN environment variable.
github.api.base-url=${GITHUB_API_BASE_URL:https://api.github.com}
github.api.token=${GITHUB_TOKEN:}