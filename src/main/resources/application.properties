spring.application.name=gitsummarizer-backend
server.port=${SERVER_PORT:8081}

# H2 file storage keeps the project runnable without paid infrastructure. Set DB_URL,
# DB_USERNAME and DB_PASSWORD to use PostgreSQL instead.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/gitsummarizer;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

github.api.base-url=${GITHUB_API_BASE_URL:https://api.github.com}
github.api.token=${GITHUB_TOKEN:}

# Gemini Developer API free tier. Without a key, summaries use a local fallback.
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

auth.session.days=${AUTH_SESSION_DAYS:7}
auth.reset.minutes=${AUTH_RESET_MINUTES:30}
auth.reset.expose-link=${AUTH_RESET_EXPOSE_LINK:false}
auth.reset.frontend-url=${FRONTEND_URL:http://localhost:3000}
auth.reset.from=${MAIL_FROM:noreply@gitsummarizer.local}

# Configure a mail host and credentials to send real password reset emails.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
